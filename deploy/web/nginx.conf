# Voidcat Cloud web app. Strict headers (headers.conf): scripts only from this site plus Google's sign-in helper,
# connections only to Firebase's APIs, nothing may frame the app.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;
    charset utf-8;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml application/wasm;

    # Built files carry a hash in their names: cache them for good. The page itself is always checked again.
    location /assets/ {
        include /etc/nginx/voidcat-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location / {
        include /etc/nginx/voidcat-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }
}
