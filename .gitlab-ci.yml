# Voidcat's pipeline: verify → secure → govern → package → deploy → release.
# Runs on merge requests and on branches without an open merge request. Releases happen on main (see release).

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH

stages: [verify, secure, govern, package, deploy, release]

include:
  - template: Jobs/SAST.gitlab-ci.yml
  - template: Jobs/Secret-Detection.gitlab-ci.yml
  - template: Jobs/Dependency-Scanning.v2.gitlab-ci.yml
    inputs:
      stage: secure

default:
  image: oven/bun:1.3

variables:
  # Run SAST and secret detection in merge request pipelines too, not only on branches.
  AST_ENABLE_MR_PIPELINES: "true"

# ——— verify ———

verify:
  stage: verify
  script:
    - bun install --frozen-lockfile
    - bun run typecheck
    - bun run lint
    - bun run test
    - bun run build
  artifacts:
    paths: [dist/]
    expire_in: 1 week

rust-test:
  stage: verify
  image: rust:1-bookworm
  needs: [verify]
  variables:
    CARGO_HOME: $CI_PROJECT_DIR/.cargo
  cache:
    key:
      files: [src-tauri/Cargo.lock]
    paths: [.cargo/registry, src-tauri/target]
  before_script:
    - apt-get update -qq
    - apt-get install -y -qq libwebkit2gtk-4.1-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev librsvg2-dev libayatana-appindicator3-dev libssl-dev pkg-config unzip > /dev/null
    - curl -fsSL https://bun.sh/install | bash
    - export PATH="$HOME/.bun/bin:$PATH"
  script:
    - bun install --frozen-lockfile
    - bun run build:mcp
    - cd src-tauri && cargo test --locked

# ——— secure ———
# SAST and secret detection come from the templates above, which default to a "test" stage; these move them to "secure".

sast:
  stage: secure

secret_detection:
  stage: secure

# ——— govern ———

privacy-guard:
  stage: govern
  needs: []
  variables:
    GIT_DEPTH: "100"
  before_script:
    - command -v git > /dev/null || (apt-get update -qq && apt-get install -y -qq git > /dev/null)
  script:
    - bun scripts/privacy-guard.ts

# ——— package ———

mcp-server:
  stage: package
  needs: [verify]
  script:
    - bun install --frozen-lockfile
    - mkdir -p out
    - bun build mcp/server.ts --compile --minify --target=bun-darwin-arm64 --outfile out/voidcat-mcp-aarch64-apple-darwin
    - bun build mcp/server.ts --compile --minify --target=bun-darwin-x64 --outfile out/voidcat-mcp-x86_64-apple-darwin
    - ls -lh out
  artifacts:
    paths: [out/]
    expire_in: 1 month

# ——— deploy (main only): Voidcat Cloud's web app on Cloud Run ———
# No keys are stored: GitLab's ID token is exchanged for a short-lived Google credential (Workload Identity
# Federation, pool "gitlab", provider "gitlab-com"), which only main of this project can use, as the
# gitlab-deploy service account.

.gcp:
  image: google/cloud-sdk:589.0.0-slim
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  id_tokens:
    GCP_ID_TOKEN:
      aud: https://iam.googleapis.com/projects/1094942921673/locations/global/workloadIdentityPools/gitlab/providers/gitlab-com
  variables:
    GCP_PROJECT: voidcat-cloud
    GCP_REGION: europe-west1
  before_script:
    - echo "$GCP_ID_TOKEN" > .gitlab_id_token
    - gcloud iam workload-identity-pools create-cred-config projects/1094942921673/locations/global/workloadIdentityPools/gitlab/providers/gitlab-com
        --service-account=gitlab-deploy@voidcat-cloud.iam.gserviceaccount.com --credential-source-file=.gitlab_id_token --output-file=.gcp_credentials.json
    - gcloud auth login --cred-file=.gcp_credentials.json --quiet
    - gcloud config set project "$GCP_PROJECT"

# The Firebase web settings (they name the project; not secret) come from Firebase itself, not from the repo.
web-config:
  extends: .gcp
  stage: package
  needs: []
  script:
    - >
      curl -fsS -H "Authorization: Bearer $(gcloud auth print-access-token)"
      "https://firebase.googleapis.com/v1beta1/projects/$GCP_PROJECT/webApps/1:1094942921673:web:97124aa25053ec04be8e18/config"
      | python3 -c 'import json,sys; c=json.load(sys.stdin); print("\n".join(f"VITE_FIREBASE_{k}={c[v]}" for k,v in [("API_KEY","apiKey"),("AUTH_DOMAIN","authDomain"),("PROJECT_ID","projectId"),("APP_ID","appId")]))'
      > web.env
    # Files live in our own bucket in Belgium, not Firebase's default one.
    - echo "VITE_FIREBASE_STORAGE_BUCKET=voidcat-cloud-files" >> web.env
    - cut -d= -f1 web.env
  artifacts:
    reports:
      dotenv: web.env

web-build:
  stage: package
  needs: [web-config]
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  script:
    - bun install --frozen-lockfile
    - bun run build
    - sh deploy/web/stage.sh build/web
  artifacts:
    paths: [build/web/]
    expire_in: 1 week

deploy-web:
  extends: .gcp
  stage: deploy
  needs: [web-build]
  environment:
    name: production
    url: https://app.voidcat.io
  script:
    - gcloud run deploy voidcat-web --source build/web --region "$GCP_REGION" --allow-unauthenticated --port 8080 --cpu 1 --memory 256Mi --max-instances 3 --quiet

# voidcat-api ("Read now in the cloud"): the API's code and the shared filing instructions, run as voidcat-api@.
# voidcat.io (landing page in site/) and app.voidcat.io (forwards to voidcat-web) on Firebase Hosting, only when they change.
deploy-hosting:
  stage: deploy
  image: oven/bun:1.3
  needs: []
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes: [site/**/*, firebase.json, .firebaserc, scripts/deploy-hosting.ts]
  id_tokens:
    GCP_ID_TOKEN:
      aud: https://iam.googleapis.com/projects/1094942921673/locations/global/workloadIdentityPools/gitlab/providers/gitlab-com
  environment:
    name: website
    url: https://voidcat.io
  script:
    - bun scripts/deploy-hosting.ts

deploy-api:
  extends: .gcp
  stage: deploy
  needs: [verify]
  script:
    - sh deploy/api/stage.sh build/api
    - gcloud run deploy voidcat-api --source build/api --region "$GCP_REGION" --service-account voidcat-api@voidcat-cloud.iam.gserviceaccount.com
        --allow-unauthenticated --port 8080 --cpu 1 --memory 512Mi --max-instances 3 --concurrency 20 --timeout 120
        --set-env-vars VERTEX_LOCATION=europe-west1,MODEL=gemini-2.5-flash,READS_PER_MONTH=300 --quiet

# ——— release (main only) ———
# A version is released by merging it: Duo's Release flow bumps the version and writes its CHANGELOG section in a
# merge request, and once that is on main this job sees a version with no tag yet, publishes the MCP server builds
# and creates the tag and the GitLab release (notes = that version's CHANGELOG section). Agents never push tags;
# the merge is the human approval. Every other main pipeline finds the tag and does nothing.

release:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  needs: [mcp-server]
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  script:
    - apk add --no-cache curl > /dev/null
    - VERSION=$(sed -n 's/^  "version": "\(.*\)",$/\1/p' package.json)
    - TAG="v$VERSION"
    - echo "package.json is at $TAG"
    - |
      if curl -sf -o /dev/null "$CI_API_V4_URL/projects/$CI_PROJECT_ID/repository/tags/$TAG"; then
        echo "$TAG is already released; nothing to do."
        exit 0
      fi
    - |
      for f in out/*; do
        curl --fail --header "JOB-TOKEN: $CI_JOB_TOKEN" --upload-file "$f" \
          "$CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/voidcat/$TAG/$(basename "$f")"
      done
    - awk -v v="$VERSION" '/^## /{p = index($0, "## " v) == 1; next} p' CHANGELOG.md > notes.md
    - test -s notes.md || echo "See CHANGELOG.md." > notes.md
    - PKG="$CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/voidcat/$TAG"
    - >
      release-cli create --name "Voidcat $TAG" --tag-name "$TAG" --ref "$CI_COMMIT_SHA" --description notes.md
      --assets-link "{\"name\":\"Voidcat for Mac (Apple silicon)\",\"url\":\"https://voidcat.io/download/mac\",\"link_type\":\"package\"}"
      --assets-link "{\"name\":\"MCP server for Apple silicon Macs\",\"url\":\"$PKG/voidcat-mcp-aarch64-apple-darwin\",\"link_type\":\"package\"}"
      --assets-link "{\"name\":\"MCP server for Intel Macs\",\"url\":\"$PKG/voidcat-mcp-x86_64-apple-darwin\",\"link_type\":\"package\"}"
  environment:
    name: releases
    url: $CI_PROJECT_URL/-/releases
