# Checks the interface on every push and merge request.
stages: [verify]

default:
  image: oven/bun:1.3

verify:
  stage: verify
  script:
    - bun install --frozen-lockfile
    - bun run typecheck
    - bun run lint
    - bun run test --passWithNoTests
    - bun run build
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH
