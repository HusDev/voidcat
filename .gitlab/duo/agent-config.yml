# Where GitLab Duo flows run their tools for this project (read from the default branch).
# curl is required: each session downloads the duo-cli with it before starting.
image: oven/bun:1.3
setup_script:
  - apt-get update -qq && apt-get install -y -qq git curl ca-certificates > /dev/null
  - bun install --frozen-lockfile
cache:
  key:
    files: [bun.lock]
    prefix: bun-deps
  paths: [node_modules/]
network_policy:
  include_recommended_allowed: true
  allowed_domains: [registry.npmjs.org, bun.sh]
