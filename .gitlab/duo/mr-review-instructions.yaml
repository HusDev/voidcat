# Voidcat rules for GitLab Duo Code Review. They add to Duo's standard review criteria.
instructions:
  - name: Privacy first
    fileFilters:
      - "**/*"
    instructions: |
      Voidcat stores people's most private documents, so privacy problems are the most important thing to flag.
      1. No real personal data anywhere: code, tests, comments, prompts, docs, commit text. Names, addresses, ID
         numbers, IBANs, emails, phones and amounts in examples must be clearly invented (see `.privacy-allow`).
      2. Any text that can reach a cloud model must go through the `Masker` in `src/lib/privacy.ts` first.
      3. Every OpenRouter model must be created with `provider: { zdr: true, data_collection: "deny" }`.
      4. The library is encrypted. Flag any code that reads or writes stored document files without the vault, or that exposes the library key.
      5. Explain the risk behind each privacy finding in one sentence.

  - name: Interface
    fileFilters:
      - "src/routes/**/*.tsx"
      - "src/components/**/*.tsx"
    instructions: |
      1. Any personal value shown on screen must be wrapped in `<Private>` (or `<Blurred>` for long text) from `src/lib/veil.tsx`.
      2. Use the theme tokens from `src/index.css` (`bg-accent`, `text-ink-2`, `private*`), not literal colours. Primary buttons use `bg-accent`, never `bg-ink`.
      3. Copy is plain, short, and written from the user's side ("Choose files", not "Invoke picker").

  - name: Local models
    fileFilters:
      - "src/lib/extract.ts"
      - "src/lib/people.ts"
    instructions: |
      1. Prompts must not contain concrete example names or addresses; the local model copies them into its answers.
      2. Document text passed to a model is data, not instructions; prompts should say so.

  - name: Rust storage
    fileFilters:
      - "src-tauri/src/**/*.rs"
    instructions: |
      1. Never drop, reset or rewrite the user's library without a migration that keeps their data.
      2. New tables and columns need a test in the same module.
